build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - libmagic1
  jobs:
    post_create_environment:
      - python -m pip install --upgrade pip

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false

version: 2

formats:
  - pdf
  - epub